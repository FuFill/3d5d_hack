<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STE AI Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <span class="title" data-i18n="title"></span>
  <span class="link" id="link"></span>
  <button class="icon" id="newChat" data-i18n-title="newChat">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon" id="menu" data-i18n-title="settings">
    <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
  </button>
</header>

<main id="feed" aria-live="polite">
  <div class="empty" id="empty">
    <p data-i18n="emptyTitle"></p>
    <p class="muted" data-i18n="emptyHint"></p>
  </div>
</main>

<footer class="composer">
  <div class="chips" id="chips"></div>
  <div class="row">
    <button class="icon" id="attach" data-i18n-title="attach">
      <svg viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a5 5 0 0 1-7.1-7.1l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
    </button>
    <textarea id="input" rows="1" data-i18n-placeholder="placeholder"></textarea>
    <button class="icon send" id="send" data-i18n-title="send">
      <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
    </button>
  </div>
  <input type="file" id="file" multiple accept=".stl,.obj,.3mf,.png,.jpg,.jpeg" hidden>
</footer>

<section class="sheet" id="sheet" hidden>
  <div class="sheet-head">
    <span data-i18n="settings"></span>
    <button class="icon" id="sheetClose" data-i18n-title="close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <form id="form" autocomplete="off">
    <label><span data-i18n="baseUrl"></span><input name="base_url" spellcheck="false"></label>
    <label><span data-i18n="apiKey"></span><input name="api_key" type="password" spellcheck="false"></label>
    <label><span data-i18n="model"></span><input name="model" spellcheck="false"></label>
    <label><span data-i18n="workerPython"></span><input name="worker_python" spellcheck="false"></label>
    <label><span data-i18n="planningInputs"></span><input name="planning_inputs_file" spellcheck="false"></label>
    <label><span data-i18n="outputDir"></span><input name="output_dir" spellcheck="false"></label>
    <div class="field">
      <span data-i18n="language"></span>
      <div class="seg" data-name="language">
        <button type="button" data-value="ru">RU</button><button type="button" data-value="en">EN</button>
      </div>
    </div>
    <div class="field">
      <span data-i18n="theme"></span>
      <div class="seg" data-name="theme">
        <button type="button" data-value="light" data-i18n="light"></button><button type="button" data-value="dark" data-i18n="dark"></button>
      </div>
    </div>
    <div class="actions">
      <button type="submit" class="primary" data-i18n="save"></button>
      <button type="button" id="test" data-i18n="test"></button>
    </div>
    <p class="note" id="formNote"></p>
    <div class="mcp">
      <span class="muted">MCP</span>
      <code id="mcpUrl"></code>
      <code id="mcpToken"></code>
    </div>
  </form>
</section>

<div class="drop" id="drop" hidden><span data-i18n="drop"></span></div>
<script src="app.js"></script>
</body>
</html>
